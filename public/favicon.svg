<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cycle" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#32e6ff">
        <animate attributeName="stop-color" values="#32e6ff;#c7ff3d;#ff4fd8;#8b5dff;#32e6ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5dff">
        <animate attributeName="stop-color" values="#8b5dff;#32e6ff;#c7ff3d;#ff4fd8;#8b5dff" dur="6s" repeatCount="indefinite" />
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0a0714" />
  <rect x="7" y="7" width="50" height="50" rx="13" fill="none" stroke="url(#cycle)" stroke-width="3.5" filter="url(#glow)" />
  <path
    d="M21 18v28h20"
    fill="none"
    stroke="url(#cycle)"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="6"
    filter="url(#glow)"
  />
  <path
    d="M27 24h18"
    fill="none"
    stroke="url(#cycle)"
    stroke-linecap="round"
    stroke-width="5"
    opacity="0.92"
    filter="url(#glow)"
  />
</svg>
